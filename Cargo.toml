[package]
name = "hyprforge-clipboard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Wayland clipboard library over wlr-data-control / ext-data-control, plus the hyprforge-clipd daemon that watches the compositor's clipboard and writes its history."
repository = "https://github.com/adamrpostjr/hyprforge"
documentation = "https://docs.rs/hyprforge-clipboard"
readme = "README.md"
keywords = ["clipboard", "wayland", "wlr-data-control", "hyprland", "linux"]
categories = ["os::linux-apis", "gui"]

# The library is read side, write side and paste synthesis over the
# compositor's clipboard protocols — it knows nothing about a popup or a
# history's own consumers. `hyprforge-clipd` below is the daemon that
# owns writing the history file; the popup that reads it lives in its
# own crate, the same "binary joins the library to a policy" split
# `hyprforge-tray` uses for `hyprforge-trayd`.
[[bin]]
name = "hyprforge-clipd"
path = "src/bin/clipd.rs"

# The history popup, in this crate rather than beside it. It is a
# separate *binary* — a keybind launches it — and a binary cannot be
# fetched as a dependency the way a library can, so it has to be inside
# the one directory `git subtree split` publishes or the clipboard's
# repository ships a daemon with no way to see the history. It did, for
# a while. See repo-plan.md, "The shape a package has to have".
[[bin]]
name = "hyprforge-clipmenu"
path = "src/bin/clipmenu/main.rs"

[dependencies]
# The compositor is the only source of clipboard content, over
# wlr-data-control / ext-data-control. No daemon of our own owns it.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Not a workspace dependency: nothing else in the workspace speaks
# ext-data-control-v1 yet. Pinned to the version already in the lock
# file (a transitive dependency of nothing here before now, pulled in
# indirectly by wayland-protocols-wlr's own tree). "staging" is the
# feature that gates ext-data-control-v1 in this crate — it has not
# graduated to stable — and "client" is the client-side bindings.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# `zwp_virtual_keyboard_manager_v1`, for synthesising a paste. Already in
# the lock file (a transitive dependency of nothing here before now, the
# same situation `wayland-protocols` was in above).
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# Compiles the ordinary "us" keyboard layout used to build the keymap a
# virtual keyboard must upload before it can send anything — see
# `wayland::keyboard`'s module doc for why a hand-written keymap naming
# only Control and V is the wrong call. Already in the lock file
# (transitively, via the wayland stack); taken directly here because
# nothing else in the workspace speaks to libxkbcommon yet.
xkbcommon = "0.8"
# Named as a git dependency, not a version, because the owner has not
# published to crates.io yet: this manifest has to work unchanged both
# inside the Hyprforge workspace and as the root of its own standalone
# repository once `git subtree split` pulls it out. Inside the
# workspace, the root Cargo.toml's `[patch]` section redirects this
# straight back to the local `crates/hyprforge-paths` and
# `crates/hyprforge-secret` directories, so nothing here touches the
# network; standalone, cargo fetches them from git.
hyprforge-paths = { git = "https://github.com/adamrpostjr/hyprforge" }
# For the `chars`/`bytes` "redacted count" formatting `Content`'s `Debug`
# shares with `hyprforge-network`'s `Psk` and `hyprforge-authui`'s typed
# password — see `types.rs` for why `Content` is not itself a `Secret<T>`.
hyprforge-secret = { git = "https://github.com/adamrpostjr/hyprforge" }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1.8"
anyhow = "1"
# An anonymous, already-unlinked file to hand the compositor a keymap
# it can `mmap` — see `wayland::keyboard::upload_keymap`. A real
# (non-dev) dependency because the paste-synthesis code path needs it
# outside tests, not only the test suite that also uses it.
tempfile = "3"
# `sync` for the `UnboundedReceiver` the watcher trait hands back and
# for the `Mutex` the control socket and the watcher loop share one
# `History` through; `rt-multi-thread` and `macros` for the daemon's
# `#[tokio::main]`; `time` for its bounded reconnect backoff and the
# control socket's idle-connection timeout; `net` and `io-util` for the
# control socket itself (`UnixListener`/`UnixStream`, `BufReader`,
# `AsyncBufReadExt`/`AsyncWriteExt`) — see `ipc.rs`.
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
# The IPC wire protocol, mirroring `notif-ipc`'s use of the same crate.
# An explicit version, not `.workspace = true`, like every other
# dependency in this manifest — this crate has to build standalone
# outside the workspace too (see the `hyprforge-paths`/`hyprforge-secret`
# comment below), where there is no `[workspace.dependencies]` to
# inherit from. Inside the workspace this still resolves to the same
# `serde_json = "1"` several other crates already depend on.
serde_json = "1"

# Used only by the `hyprforge-clipmenu` binary. Cargo has no way to scope
# a dependency to one target of a crate that has several, the same
# arrangement `hyprforge-tray` and `hyprforge-displayd` carry.
#
# The popup draws into a raw Wayland buffer, so it needs iced's pieces
# directly rather than the `iced` umbrella: there is no winit window
# here. `iced_tiny_skia` and not `iced_wgpu` — see CLAUDE.md on
# `web-colors`, which is why every surface in this suite is drawn by the
# same renderer. `image` on both, for the thumbnails a copied picture
# gets.
hyprforge-popup = { git = "https://github.com/adamrpostjr/hyprforge" }
hyprforge-appearance = { git = "https://github.com/adamrpostjr/hyprforge" }
hyprforge-look = { git = "https://github.com/adamrpostjr/hyprforge" }
hyprforge-process = { git = "https://github.com/adamrpostjr/hyprforge" }
iced_tiny_skia = { version = "0.14", default-features = false, features = ["image", "wayland"] }
iced_runtime = "0.14"
iced_widget = { version = "0.14", features = ["image"] }
iced_renderer = { version = "0.14", default-features = false, features = ["tiny-skia"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[features]
# Exposes `backend::mock::MockBackend` (and `write::mock::MockWriter`,
# `paste::mock::MockPaster`) outside `#[cfg(test)]`, so the daemon's and
# the popup's own tests can drive a clipboard with no compositor
# attached.
mock = []
